<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#5a1a3c;--panel:#241845;--panel2:#2e2058;--line:#4a3a7a;--ink:#1a0716;--fg:#fff0f7;--dim:#cdb4d8;--pink:#ff5fa8;--lite:#ffc2e0;--gold:#ffd166;--teal:#6ef0d2;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1535;--panel:#241845;--fg:#fff0f7;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1535;--panel:#241845;--fg:#fff0f7}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ov{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-start;justify-content:center;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));background:rgba(70,12,44,.42);overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain}
#ov.off{display:none}
.panel{margin:auto;max-width:740px;width:100%;text-align:center;background:var(--panel);padding:22px 18px 18px;box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--line),0 0 0 9px var(--ink),8px 10px 0 9px rgba(0,0,0,.35)}
h1{font-family:"Press Start 2P",monospace;font-weight:400;font-size:clamp(22px,6vw,42px);line-height:1.25;margin:4px 0 8px;color:var(--pink);text-shadow:3px 3px 0 #5a1040,6px 6px 0 var(--ink)}
h2{font-family:"Press Start 2P",monospace;font-weight:400;font-size:clamp(13px,3.4vw,18px);line-height:1.5;margin:0 0 10px;color:var(--lite)}
h3{font-family:"Press Start 2P",monospace;font-weight:400;font-size:10px;margin:14px 0 6px;color:var(--gold);line-height:1.6;text-align:left}
p{font-size:17px;line-height:1.45;color:var(--dim);margin:8px auto;max-width:62ch}
.small{font-size:14px}
.btn{font-family:"Press Start 2P",monospace;font-size:11px;line-height:1.4;background:var(--pink);color:#2a0820;border:0;padding:13px 18px;margin:6px 4px;cursor:pointer;box-shadow:inset -3px -4px 0 #b8306f,inset 3px 3px 0 #ff9cc9,0 0 0 3px var(--ink)}
.btn:active{transform:translateY(2px)}
.btn.alt{background:var(--panel2);color:var(--fg);box-shadow:inset -3px -4px 0 #1a1238,inset 3px 3px 0 #4a3a7a,0 0 0 3px var(--ink)}
.btn.danger{background:#b3122e;color:#fff;box-shadow:inset -3px -4px 0 #6a0618,inset 3px 3px 0 #e8445e,0 0 0 3px var(--ink)}
.btn.alt.warn{color:#ff9aa6}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn:focus-visible,.card:focus-visible,.tab:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:8px}

.card .t{font-family:"Press Start 2P",monospace;font-size:10px;line-height:1.5;color:var(--lite)}

.fact{background:#1a1238;color:var(--teal);padding:12px 14px;margin:14px auto;text-align:left;box-shadow:0 0 0 2px var(--line);max-width:60ch}
.fact b{font-family:"Press Start 2P",monospace;font-weight:400;font-size:9px;color:var(--gold);display:block;margin-bottom:6px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:6px 0 10px}
.tab{font-family:"Press Start 2P",monospace;font-size:9px;background:transparent;color:var(--dim);border:0;padding:10px 9px;cursor:pointer;box-shadow:inset 0 -3px 0 var(--line)}

.stats{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.stats div{font-size:14px;color:var(--dim)}.stats b{display:block;font-family:"Press Start 2P",monospace;font-weight:400;font-size:16px;color:var(--fg);margin-bottom:6px}
.bars{max-width:440px;margin:8px auto;text-align:left}
.bar{display:grid;grid-template-columns:140px 1fr 60px;gap:8px;align-items:center;font-size:14px;margin:5px 0;color:var(--fg)}
.bar i{display:block;height:10px;background:var(--pink);box-shadow:0 0 0 2px var(--ink)}
.bar span:last-child{text-align:right;color:var(--dim)}
.ans{display:grid;gap:10px;max-width:540px;margin:12px auto}
.ans .btn{text-align:left;font-family:"Pixelify Sans",system-ui,sans-serif;font-size:18px;line-height:1.3;padding:12px 14px;margin:0}
.ans .btn:disabled{opacity:1}
.nm{font-family:"Press Start 2P",monospace;font-size:11px;line-height:1.5;color:var(--lite)}
.ans .btn.good{background:var(--teal);box-shadow:inset -3px -4px 0 #2a9a80,0 0 0 3px var(--ink)}
.ans .btn.bad{background:#ff8a9a;box-shadow:inset -3px -4px 0 #a03040,0 0 0 3px var(--ink)}

.sec p{text-align:left;margin:4px 0 10px;color:var(--fg)}
.sub{color:var(--teal);font-size:15px;margin:0 0 8px}
a{color:var(--teal)}
.pips{letter-spacing:2px;color:var(--gold);font-family:"Press Start 2P",monospace;font-size:8px}
.keys{font-size:14px;color:var(--dim);line-height:1.5}
.keys b{color:var(--fg);font-weight:600}
#tip{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3;width:max-content;max-width:min(560px,calc(100vw - 32px));background:rgba(26,18,56,.94);color:var(--fg);padding:10px 14px;font-size:16px;line-height:1.35;box-shadow:0 0 0 3px var(--ink),0 0 0 5px var(--teal);pointer-events:none;opacity:0;transition:opacity .25s}
#tip.on{opacity:1}
#tip b{font-family:"Press Start 2P",monospace;font-weight:400;font-size:9px;color:var(--teal);display:block;margin-bottom:6px}
#hb{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3;display:none;gap:8px}
body.play #hb{display:flex}
#hb .btn{margin:0;padding:10px 12px;font-size:9px}
#db{display:none;position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:3;width:86px;height:86px;border:0;background:rgba(255,95,168,.22);color:var(--lite);font:10px "Press Start 2P",monospace;box-shadow:0 0 0 3px var(--pink),0 0 0 6px var(--ink);touch-action:none;border-radius:50%}
@media (pointer:coarse){body.play #db{display:block}}
body.touch.play #db{display:block}
@media (max-height:440px){#tip{bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:13px;max-width:min(420px,calc(100vw - 260px))}.panel{padding:14px 12px}h1{font-size:22px}#db{width:72px;height:72px}}
.pw{font-family:"Press Start 2P",monospace;font-size:13px;width:min(100%,320px);padding:14px 12px;margin:10px auto 4px;display:block;background:#1a1238;color:var(--fg);border:0;box-shadow:0 0 0 3px var(--ink),inset 0 0 0 2px var(--line);text-align:center;user-select:text;-webkit-user-select:text;touch-action:manipulation}
.pw:focus{outline:3px solid var(--gold);outline-offset:4px}
.pwmsg{min-height:1.5em;font-size:15px}
#tb{display:none;position:fixed;right:30px;bottom:calc(122px + env(safe-area-inset-bottom,0px));z-index:3;width:62px;height:62px;border:0;background:rgba(201,184,255,.22);color:#efe8ff;font:9px "Press Start 2P",monospace;box-shadow:0 0 0 3px #c9b8ff,0 0 0 6px var(--ink);touch-action:none;border-radius:50%}
@media (pointer:coarse){body.play.chrono #tb{display:block}}
body.touch.play.chrono #tb{display:block}
.panel.compact{max-width:560px;padding:14px 12px 10px}
.panel.compact h2{font-size:12px;margin:0 0 4px}
.panel.compact>p.small{font-size:12.5px;margin:4px auto;line-height:1.35}
.panel.compact .cards{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin:8px 0}
.panel.compact .card{padding:8px;gap:4px}
.panel.compact .card .ic{gap:8px}
.panel.compact .card img.ico{width:30px;height:30px}
.panel.compact .card .t{font-size:8px}
.panel.compact .card .m{font-size:7px}
.panel.compact .card .d{font-size:14px;line-height:1.25}
.panel.compact .card .r{font-size:12px;line-height:1.3}
.panel.compact .row{margin-top:2px}
.panel.compact .btn{font-size:9px;padding:9px 12px;margin:4px}
#crt{position:fixed;inset:0;pointer-events:none;z-index:4;background:repeating-linear-gradient(0deg,rgba(0,0,0,.1) 0 1px,transparent 1px 3px)}
body.nofx #crt{display:none}
@media (prefers-reduced-motion:reduce){#tip{transition:none}}
@media (max-width:480px){#tip{font-size:14px;padding:8px 10px;bottom:calc(124px + env(safe-area-inset-bottom,0px))}.panel{padding:18px 12px 14px}.cards{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.bar{grid-template-columns:110px 1fr 48px}}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="crt"></div>
<div id="tip" role="status" aria-live="polite"></div>
<div id="hb"><button class="btn alt" data-hb="p" aria-label="Pause">II</button><button class="btn alt" data-hb="s" aria-label="Toggle sound">SND</button></div>
<button id="db" aria-label="Dash">DASH</button>
<button id="tb" aria-label="Time stop">TIME</button>
<div id="ov" class="off"></div>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov'),tipEl=document.getElementById('tip');
let W=0,H=0,DPR=1,Z=1,S='menu',G=null,last=0,joy=null,dashReq=0,tsReq=0,AC=null,tipT=0,vig=null;
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),pick1=a=>a[Math.random()*a.length|0],clamp=(v,a,b)=>v<a?a:v>b?b:v;
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
const keys={},WW=4800,WH=3400,CAM={x:WW/2,y:WH/2},SAFE={t:0,b:0};
const VW=()=>W/Z,VH=()=>H/Z;

/* ---------- save data ---------- */
const SKEY='ribbon_guardians_v2';
const DEF={hope:0,best:0,meta:{},heroes:{tcell:1},hero:'tcell',seen:{},quiz:{},stats:{runs:0,kills:0,wins:0,long:0},set:{mute:false,music:true,vol:1,fx:true,info:true}};
let SAVE=JSON.parse(JSON.stringify(DEF));
try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');
 if(s){Object.assign(SAVE,s);for(const k of['meta','heroes','seen','quiz','stats','set'])SAVE[k]=Object.assign({},DEF[k],s[k]||{})}
 else{try{SAVE.set.fx=!matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}}}catch(e){}
SAVE.heroes.tcell=1;
function save(){SAVE.ts=Date.now();try{localStorage.setItem(SKEY,JSON.stringify(SAVE))}catch(e){}if(typeof cloudPush==='function')cloudPush()}
function applyFx(){document.body.classList.toggle('nofx',!SAVE.set.fx)}

/* ---------- screen ---------- */
const probe=document.createElement('div');
probe.style.cssText='position:fixed;left:0;top:0;width:1px;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
document.body.appendChild(probe);
let LOWQ=false,PTCAP=600;
function rs(){DPR=Math.min(devicePixelRatio||1,LOWQ?1:2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
 Z=Math.min(W,H)<560?2/3:1;const cs=getComputedStyle(probe);SAFE.t=parseFloat(cs.paddingTop)||0;SAFE.b=parseFloat(cs.paddingBottom)||0;vig=null}
addEventListener('resize',rs);addEventListener('orientationchange',()=>setTimeout(rs,250));if(window.visualViewport)visualViewport.addEventListener('resize',rs);rs();

/* ---------- sound ---------- */
function snd(f,d=.08,t='square',v=.04,f2){if(SAVE.set.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
 const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);
 g.gain.setValueAtTime(v*SAVE.set.vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}
function unlockAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0)}catch(e){}}
for(const ev of['pointerdown','touchstart','keydown'])addEventListener(ev,function u(){unlockAudio();removeEventListener(ev,u,true)},true);
const MUS=[[330,0,392,0,440,392,330,0,294,0,330,0,392,330,294,0],[294,0,349,0,440,349,294,0,262,0,294,0,349,294,262,0],[262,0,330,0,392,330,262,0,247,0,262,0,330,262,247,0],[392,0,466,0,523,466,392,0,349,0,392,0,466,392,349,0],[440,0,523,0,659,523,440,0,392,0,440,0,523,440,494,0]];
const BAS=[[110,0,0,110,0,0,131,0,98,0,0,98,0,0,110,0],[98,0,0,98,0,0,117,0,87,0,0,87,0,0,98,0],[87,0,0,87,0,0,104,0,82,0,0,82,0,0,87,0],[131,0,0,131,0,0,156,0,117,0,0,117,0,0,131,0],[110,0,0,110,0,0,87,0,98,0,0,98,0,0,82,0]];
let ms=0;
setInterval(()=>{if(S!=='play'||SAVE.set.mute||!SAVE.set.music||!G||G.intro>0)return;const i=ms++%16,si=G.stage,k=G.en.some(e=>e.B)?1.26:1;
 if(MUS[si][i])snd(MUS[si][i]*k,.16,'triangle',.018);if(BAS[si][i])snd(BAS[si][i]*k,.28,'square',.013)},190);

/* =================== PIXEL ART =================== */
const INK='#1a0716',SC=3;
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function rows(R,P){const h=R.length,w=Math.max(...R.map(r=>r.length)),c=mk(w,h),x=c.getContext('2d');
 R.forEach((r,j)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch!=='.'&&P[ch]){x.fillStyle=P[ch];x.fillRect(i,j,1,1)}}});return c}
function outline(c,col=INK){const w=c.width+2,h=c.height+2,t=mk(w,h),tx=t.getContext('2d');
 for(const[dx,dy]of[[0,1],[2,1],[1,0],[1,2]])tx.drawImage(c,dx,dy);
 tx.globalCompositeOperation='source-in';tx.fillStyle=col;tx.fillRect(0,0,w,h);tx.globalCompositeOperation='source-over';tx.drawImage(c,1,1);return t}
function sil(c,col='#fff'){const o=mk(c.width,c.height),x=o.getContext('2d');x.drawImage(c,0,0);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,o.width,o.height);return o}
function pxl(x,c,i,j,w=1,h=1){x.fillStyle=c;x.fillRect(Math.round(i),Math.round(j),w,h)}
function disc(x,cx,cy,r,c){x.fillStyle=c;for(let j=Math.floor(cy-r);j<=cy+r;j++)for(let i=Math.floor(cx-r);i<=cx+r;i++)if(Math.hypot(i+.5-cx,j+.5-cy)<=r)x.fillRect(i,j,1,1)}
function ring(x,cx,cy,r,c){x.fillStyle=c;for(let j=Math.floor(cy-r-1);j<=cy+r+1;j++)for(let i=Math.floor(cx-r-1);i<=cx+r+1;i++)if(Math.abs(Math.hypot(i+.5-cx,j+.5-cy)-r)<.55)x.fillRect(i,j,1,1)}
/* shaded blob, light from top-left, with dithered transitions */
function blob(x,cx,cy,rx,ry,P,o={}){const wb=o.wob||0,wf=o.wf||5,wp=o.wp||0;
 for(let j=Math.floor(cy-ry*1.35-1);j<=cy+ry*1.35+1;j++)for(let i=Math.floor(cx-rx*1.35-1);i<=cx+rx*1.35+1;i++){
  const dx=(i+.5-cx)/rx,dy=(j+.5-cy)/ry;let d=Math.hypot(dx,dy);if(wb)d/=1+wb*Math.sin(Math.atan2(dy,dx)*wf+wp);
  if(d>1)continue;const lit=-(dx*.55+dy*.85);let c=P.m;
  if(d>.8&&lit<.15)c=P.d;else if(lit>.5&&d<.62)c=P.h||P.l;else if(lit>.2)c=P.l;
  else if(lit>.04&&(i+j)%2===0)c=P.l;else if(d>.62&&lit<0&&(i+j)%2===0)c=P.d;
  x.fillStyle=c;x.fillRect(i,j,1,1)}}
function eyes(x,cx,cy,sep,lx,blink,angry,s=2){
 for(const sx of[-1,1]){const ex=Math.round(cx+sx*sep-s/2),ey=Math.round(cy-s/2);
  if(blink){pxl(x,INK,ex,ey+(s>>1),s,1);continue}
  pxl(x,'#fff',ex,ey,s,s);const pw=s>2?2:1;pxl(x,INK,ex+(lx>0?s-pw:lx<0?0:(s-pw)>>1),ey+s-pw,pw,pw);
  if(angry){if(sx<0){pxl(x,INK,ex-1,ey-2);pxl(x,INK,ex,ey-2);pxl(x,INK,ex+s-1,ey-1)}else{pxl(x,INK,ex+s-1,ey-2);pxl(x,INK,ex+s,ey-2);pxl(x,INK,ex,ey-1)}}}}
function ribbonMark(x,i,j){pxl(x,'#ffc2e0',i+1,j);pxl(x,'#ff3b7a',i,j+1);pxl(x,'#ff3b7a',i+2,j+1);pxl(x,'#ff3b7a',i+1,j+2);pxl(x,'#a0205f',i,j+3);pxl(x,'#a0205f',i+2,j+3)}

/* ---------- heroes ---------- */
const HDEF={
 tcell:{m:'#5ab0ff',l:'#a8d8ff',d:'#2a64b0',h:'#e4f4ff',rx:6.5,ry:6,f:'rec'},
 nk:{m:'#ffa24a',l:'#ffd09a',d:'#b0601a',h:'#fff0d8',rx:6.1,ry:5.8,f:'gran'},
 macro:{m:'#b07aff',l:'#d8baff',d:'#6a3aa8',h:'#f2e8ff',rx:7.4,ry:6.6,f:'pod'},
 bcell:{m:'#5ee09a',l:'#b0f5d0',d:'#239a5c',h:'#eafff4',rx:6.3,ry:6,f:'ab'},
 dend:{m:'#ffd86a',l:'#fff0b0',d:'#b8901f',h:'#fffbe8',rx:5.6,ry:5.6,f:'den'},
 neutro:{m:'#e6dcff',l:'#ffffff',d:'#9a8ad0',h:'#ffffff',rx:6.3,ry:6,f:'lobe'},
 helper:{m:'#4ad6e8',l:'#a8f2fa',d:'#1f8ea0',h:'#effdff',rx:6.3,ry:6,f:'cap'},
 admin:{m:'#c9b8ff',l:'#efe8ff',d:'#6a4ad0',h:'#ffffff',rx:7,ry:6.4,f:'crown'}};
function heroFrame(id,fr,blink){const D=HDEF[id],N=26,c=mk(N,N),x=c.getContext('2d'),cx=13,bob=[0,-1,0,-1][fr],cy=14+bob;
 const rx=D.rx+(fr%2?-.25:.15),ry=D.ry+(fr%2?.3:-.1),fo=[[-1,1],[0,0],[1,-1],[0,0]][fr],by=Math.round(cy+ry-1.5);

 else if(S==='dying'&&G){G.dieT-=dt;for(const q of G.pt){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.95;q.vy*=.95;q.l-=dt}G.pt=G.pt.filter(x=>x.l>0);G.shake*=Math.pow(.003,dt);if(G.dieT<=0)endRun(false)}
 perf.l=now;
 if(S==='play'&&tipT>0){tipT-=dt;if(tipT<=0)tipEl.classList.remove('on')}
 if(S==='menu')menuStage=Math.floor(menuT/24)%STG.length;
 draw(S==='play'||S==='menu'||S==='dying'?dt:0);if(thumbs.length)drawThumbs();syncHB();
 }catch(err){console.error(err)}
 requestAnimationFrame(loop)}

/* =================== CROSS-DEVICE SYNC =================== */
const SYNC={on:false,doc:null,busy:false,again:false,t:0};
function canon(o){return JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v)}
function cloudPart(s){const c=JSON.parse(JSON.stringify(s));delete c.set;return c}
function mergeSave(a,b){const n=(a.ts||0)>=(b.ts||0)?a:b,o=n===a?b:a,r=JSON.parse(JSON.stringify(n)),fresh=(o.ts||0)<(n.wipe||0);
 for(const k of['heroes','seen','quiz'])r[k]=Object.assign({},fresh?{}:o[k]||{},n[k]||{});
 r.meta=Object.assign({},n.meta||{});if(!fresh)for(const k in(o.meta||{}))r.meta[k]=Math.max(r.meta[k]||0,o.meta[k]||0);
 r.stats=Object.assign({},DEF.stats,n.stats||{});if(!fresh)for(const k in(o.stats||{}))r.stats[k]=Math.max(r.stats[k]||0,o.stats[k]||0);
 r.best=fresh?(n.best||0):Math.max(a.best||0,b.best||0);r.wipe=Math.max(a.wipe||0,b.wipe||0);r.ts=Math.max(a.ts||0,b.ts||0);r.heroes.tcell=1;if(!r.heroes[r.hero])r.hero='tcell';if(typeof r.hope!=='number')r.hope=0;return r}
function adopt(remote){const set=SAVE.set,m=mergeSave(cloudPart(SAVE),remote);m.set=set;for(const k of['meta','heroes','seen','quiz','stats'])m[k]=Object.assign({},DEF[k],m[k]);SAVE=m;
 try{localStorage.setItem(SKEY,JSON.stringify(SAVE))}catch(e){}
 if(canon(cloudPart(SAVE))!==canon(remote)){SAVE.ts=Date.now();cloudPush()}
 if(S==='menu'){if(page==='home')menu();else if(page==='heroes')heroes();else if(page==='perks')perks()}}
function cloudPush(){if(!SYNC.on||!SYNC.doc)return;clearTimeout(SYNC.t);SYNC.t=setTimeout(async()=>{if(SYNC.busy){SYNC.again=true;return}SYNC.busy=true;
 try{await SYNC.doc.set(cloudPart(SAVE))}catch(e){if(e&&/not_granted|permission|denied/i.test(String(e.code||e.message))){SYNC.on=false;if(S==='menu'&&page==='home')menu()}}
 SYNC.busy=false;if(SYNC.again){SYNC.again=false;cloudPush()}},1200)}
(async()=>{try{if(!window.claude||typeof window.claude.use!=='function')return;const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!db||!user)return;
 const id=await user.id();if(!id)return;SYNC.doc=db.doc('data/users/'+id+'/save');const snap=await SYNC.doc.get();SYNC.on=true;
 if(snap.exists)adopt(JSON.parse(JSON.stringify(snap.data())));else cloudPush();
 SYNC.doc.onSnapshot(s=>{if(!s.exists||s.metadata.hasPendingWrites)return;const r=s.data();if((r.ts||0)>(SAVE.ts||0))adopt(JSON.parse(JSON.stringify(r)))},()=>{});
 if(S==='menu'&&page==='home')menu()}catch(e){SYNC.on=false}})();
applyFx();
if(document.fonts&&document.fonts.load)document.fonts.load('10px "Press Start 2P"').catch(()=>{});
menu();requestAnimationFrame(t=>{last=t;loop(t)});
